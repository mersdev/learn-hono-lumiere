<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="/js/config.js"></script>
  <title>Admin Dashboard · LUMIÈRE</title>
</head>
<body class="min-h-screen flex flex-col bg-slate-50">
  <header id="site-header"></header>
  
  <main class="flex-grow w-full max-w-7xl mx-auto px-4 py-12 sm:px-6 lg:px-8">
    <div class="mb-8">
      <h1 class="text-4xl font-serif text-slate-900">Command Center</h1>
      <p class="text-slate-500 mt-2">Manage platform logistics and luxury inventory.</p>
    </div>

    <!-- Tab Navigation -->
    <div class="mb-8 border-b border-slate-200">
      <nav class="-mb-px flex flex-wrap gap-x-6" aria-label="Tabs">
        <button id="tab-logistics" class="border-slate-900 text-slate-900 whitespace-nowrap border-b-2 py-4 px-1 text-xs sm:text-sm transition-colors">Logistics & Fulfillment</button>
        <button id="tab-catalog" class="border-transparent text-slate-500 hover:border-slate-300 hover:text-slate-700 whitespace-nowrap border-b-2 py-4 px-1 text-xs sm:text-sm transition-colors">Catalog Management</button>
      </nav>
    </div>
    
    <!-- VIEW: LOGISTICS -->
    <div id="view-logistics" class="block">
      <div id="admin-metrics" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12"></div>
      <div id="admin-root"></div>
    </div>

    <!-- VIEW: CATALOG -->
    <div id="view-catalog" class="hidden">
      <div class="mb-6 flex justify-between items-end">
        <h2 class="text-2xl font-serif text-slate-900">Inventory Overview</h2>
        <button id="add-product-btn" class="bg-slate-900 text-white text-[10px] uppercase tracking-widest font-bold py-3 px-6 hover:bg-slate-800 transition-colors">
          + New Listing
        </button>
      </div>
      <div id="catalog-root"></div>
    </div>
  </main>

  <!-- Product Management Modal -->
  <div id="product-modal" class="fixed inset-0 bg-slate-900/40 hidden z-50 flex items-center justify-center backdrop-blur-sm">
    <div class="bg-white p-8 border border-slate-200 shadow-xl w-full max-w-md relative max-h-[90vh] overflow-y-auto">
      <button id="close-product-btn" class="absolute top-4 right-4 text-slate-400 hover:text-slate-900 transition-colors">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
      
      <h2 id="product-modal-title" class="text-2xl font-serif text-slate-900 mb-6">New Listing</h2>
      <form id="product-form" class="space-y-5">
        <input type="hidden" id="modal-product-id">
        
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-slate-900 mb-2 font-bold">Item Name</label>
          <input type="text" id="modal-product-name" required class="w-full border-b border-slate-300 bg-transparent py-2 text-sm focus:outline-none focus:border-slate-900 font-serif">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-slate-900 mb-2 font-bold">Description</label>
          <textarea id="modal-product-description" required maxlength="1000" class="w-full border-b border-slate-300 bg-transparent py-2 text-sm focus:outline-none focus:border-slate-900 font-serif"></textarea>
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-slate-900 mb-2 font-bold">Category</label>
          <select id="modal-product-category" required class="w-full border-b border-slate-300 bg-transparent py-2 text-sm focus:outline-none focus:border-slate-900 font-serif">
            <option value="Bags">Bags</option><option value="Watches">Watches</option><option value="Bangles">Bangles</option><option value="Necklaces">Necklaces</option>
          </select>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-slate-900 mb-2 font-bold">Price (RM)</label>
            <input type="number" step="0.01" id="modal-product-price" required class="w-full border-b border-slate-300 bg-transparent py-2 text-sm focus:outline-none focus:border-slate-900 font-serif">
          </div>
          <div>
            <label class="block text-[10px] uppercase tracking-widest text-slate-900 mb-2 font-bold">Stock Count</label>
            <input type="number" id="modal-product-stock" required class="w-full border-b border-slate-300 bg-transparent py-2 text-sm focus:outline-none focus:border-slate-900 font-serif">
          </div>
        </div>

        <div>
          <label class="block text-[10px] uppercase tracking-widest text-slate-900 mb-2 font-bold">Image URL</label>
          <input type="text" id="modal-product-image" required placeholder="/assets/images/products/item.png" class="w-full border-b border-slate-300 bg-transparent py-2 text-sm focus:outline-none focus:border-slate-900 font-serif">
        </div>

        <div>
          <label class="block text-[10px] uppercase tracking-widest text-slate-900 mb-2 font-bold">Visibility Status</label>
          <select id="modal-product-status" class="w-full border-b border-slate-300 bg-transparent py-2 text-sm focus:outline-none focus:border-slate-900 font-serif">
            <option value="1">Active (Visible on Storefront)</option>
            <option value="0">Hidden (Draft / Archive)</option>
          </select>
        </div>
        
        <button type="submit" class="w-full bg-slate-900 text-white text-[10px] uppercase tracking-widest font-bold py-4 hover:bg-slate-800 transition-colors mt-4">
          Save Product
        </button>
      </form>
    </div>
  </div>

  <footer id="site-footer"></footer>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
